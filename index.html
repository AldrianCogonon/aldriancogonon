<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aldrian Cogonon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <section class="poster-stage">

    <!-- Header INSIDE stage (intentional design choice) -->
    <header class="stage-header">
      <h1>Aldrian Cogonon</h1>
      <p>Frontend-focused developer crafting clean, interactive interfaces.</p>
    </header>

    <div class="poster-track">

      <!-- Poster: Projects -->
      <div class="poster" data-poster>
        <div class="poster-preview">
          <div class="poster-label">
            <h3>Projects</h3>
            <span>Selected Work</span>
          </div>
        </div>

        <div class="poster-content">
          <button class="close-btn" aria-label="Close">✕</button>
          <h2>Projects</h2>
          <p>Your content goes here…</p>
        </div>
      </div>

      <!-- Poster: About -->
      <div class="poster" data-poster>
        <div class="poster-preview">
          <div class="poster-label">
            <h3>About</h3>
            <span>Who I Am</span>
          </div>
        </div>

        <div class="poster-content">
          <button class="close-btn" aria-label="Close">✕</button>
          <h2>About Me</h2>
          <p>Your about content here…</p>
        </div>
      </div>

    </div>
  </section>

  <!-- JavaScript -->
  <script src="js/backend.js" defer></script>

</body>
</html>
