<!DOCTYPE html>
	<html lang="en">
		<head>
  			<meta charset="UTF-8">
  			<title>Aldrian Cogonon</title>

  			<style>
    				/* RESET */
    				* {
      				margin: 0;
      				padding: 0;
      				box-sizing: border-box;
    				}

    				body {
      					font-family: Arial, sans-serif;
      					color: white;
    				}

    				/* HERO SECTION */
    				.hero {
     				min-height: 100vh;
      				background:
        			linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
        			url("asset/images/background.jpg");
      				background-size: cover;
      				background-position: center;

      				display: flex;
      				flex-direction: column;
      				justify-content: center;
      				align-items: center;
     				text-align: center;
      				padding: 20px;
    				}

    				/* NAVIGATION */
    				nav {
      					position: absolute;
      					top: 20px;
      					right: 30px;
    				}

    				nav a {
      					color: white;
      					text-decoration: none;
      					margin-left: 20px;
      					font-weight: bold;
    				}

    				nav a:hover {
      					text-decoration: underline;
    				}

    				/* PROFILE IMAGE */
    				.portfolio-image {
      				max-width: 220px;
      				margin-bottom: 20px;
    				}

    				.portfolio-image img {
      				width: 100%;
      				border-radius: 50%;
      				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    				}

   				/* TEXT */
    				h1 {
      					font-size: 3rem;
      					margin-bottom: 10px;
    				}

    				p {
      					font-size: 1.2rem;
     					opacity: 0.9;
    				}
			</style>
		</head>

		<body>

  			<section class="hero">

    				<nav>
      					<a href="index.html">Home</a>
      					<a href="about.html">About</a>
      					<a href="services.html">Services</a>
      					<a href="projects.html">Projects</a>
      					<a href="contact.html">Contact</a>
    				</nav>
	
    				<div class="portfolio-image">
      					<img src="asset/images/Aldrian.jpg" alt="Portrait of Aldrian">
    				</div>

    				<h1>Aldrian Cogonon</h1>
    				<p>Beginner Web Developer | Portfolio</p>

  			</section>

		</body>
	</html>
